# Builds the site and publishes it on GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Download links and the changelog are read from the app's GitHub releases at build time, so the site is rebuilt:
#   - on every push to main,
#   - when the app repo's release workflow sends a `release-published` repository_dispatch,
#   - once a day as a fallback, and by hand (Run workflow).
name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
